name: Obfuscate JS in-place

on:
  push:
    branches:
      - source
    paths:
      - index.html

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: source
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install obfuscator
        run: npm install -g javascript-obfuscator

      - name: Obfuscate and push
        run: |
          python3 -c "
import re, sys
html = open('index.html').read()
m = re.search(r'<script>(.*?)<\/script>', html, re.DOTALL)
if not m: sys.exit(1)
open('_raw.js','w').write(m.group(1))
"
          javascript-obfuscator _raw.js --output _obf.js --compact true --control-flow-flattening true --string-array true --string-array-encoding base64 --self-defending false
          python3 -c "
import re, sys
html = open('index.html').read()
obf = open('_obf.js').read()
r = re.sub(r'<script>.*?<\/script>','<script>'+obf+'<\/script>',html,flags=re.DOTALL)
open('index_obf.html','w').write(r)
c=open('index_obf.html').read()
if '<script>' not in c or len(c)<len(html): sys.exit(1)
print('OK',len(c))
"
          rm -f _raw.js _obf.js
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout main
          cp index_obf.html index.html
          rm -f index_obf.html
          git add index.html
          git diff --cached --quiet || git commit -m "chore: obfuscation [skip ci]"
          git push origin main
